spring.application.name=factoraje

# Datasource configuration
spring.datasource.jndi-name=java:comp/env/jdbc/FinanciamientoCuentasDB
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# El esquema lo crea el DBA con Entregables/01_Puesta_en_marcha/01_Script_inicial/01_esquema.sql
# y los cambios posteriores se aplican con los scripts de Entregables/02_Actualizaciones,
# en todos los ambientes. Hibernate solo lo valida.
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.open-in-view=false

# Otro ambiente de desarrollo, con la base vacía y sin scripts. Descomentar esta
# línea para que Hibernate cree y actualice el esquema. No usarla en QA ni en producción.
#spring.jpa.hibernate.ddl-auto=update

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Zona horaria usada para la hora de corte y la fecha de desembolso
app.business-zone=America/El_Salvador

# Techo técnico de la carga. El límite que ve el usuario es el parámetro
# UPLOAD_MAX_FILE_SIZE_MB (máximo 50), que se valida en el controlador.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# La llave HMAC del JWT es el parámetro JWT_SECRET (Base64, mínimo 256 bits).
# La duración del token es el parámetro JWT_EXPIRATION_MINUTES.

